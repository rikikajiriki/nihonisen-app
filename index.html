const TITLES={"grad": "卒試過去問", "term": "期末過去問", "class": "授業プリント問題集", "national": "国試過去問"};
let live=null;
function start(key){
 if(!APPS[key])return;live=key;document.body.classList.add('in-app');
 const raw=atob(APPS[key]);const bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));
 document.getElementById('appFrame').srcdoc=new TextDecoder('utf-8').decode(bytes);
 history.replaceState({},'', '#app='+key);
}
function home(){document.getElementById('appFrame').removeAttribute('srcdoc');document.body.classList.remove('in-app');live=null;history.replaceState({},'','#');scrollTo(0,0)}
window.addEventListener('message',e=>{if(e.data?.type==='fourway-home')home()});
window.addEventListener('hashchange',()=>{const key=location.hash.split('app=')[1];if(key&&APPS[key]){if(live!==key)start(key)}else if(live)home()});

if(location.hash.includes('app=')){const key=location.hash.split('app=')[1];if(APPS[key])start(key)}

/* Desktop-only preview: iframe width changes; srcdoc and learning state are untouched. */
(()=>{
 const isDesktop=!/iPhone|iPod|iPad|Android|Mobile/i.test(navigator.userAgent)
   && !!window.matchMedia('(min-width:1024px) and (hover:hover) and (pointer:fine)').matches;
 if(!isDesktop)return;
 document.body.classList.add('desktop-preview','preview-phone');
 function setPreview(which){
   document.body.classList.toggle('preview-tablet',which==='tablet');
   document.body.classList.toggle('preview-phone',which==='phone');
   document.getElementById('previewPhone').setAttribute('aria-pressed',String(which==='phone'));
   document.getElementById('previewTablet').setAttribute('aria-pressed',String(which==='tablet'));
 }
 document.getElementById('previewPhone').addEventListener('click',()=>setPreview('phone'));
 document.getElementById('previewTablet').addEventListener('click',()=>setPreview('tablet'));
})();
